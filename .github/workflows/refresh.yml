name: refresh-live-data
# GitHub's cron fires unreliably (sometimes once every few hours), so each run
# keeps itself alive for ~5h40m and refreshes every 20 minutes. A newer run
# cancels the older one, so there is never more than one loop.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch and publish every 20 min
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() {
            rm -rf pub && mkdir pub && cp out/live.json pub/ && cd pub
            git init -q -b data
            git config user.name "sharehows-data bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.json
            git commit -qm "live data $(date -u +%FT%TZ)"
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            cd ..
          }
          for i in $(seq 1 17); do
            if node scripts/fetch.mjs; then publish || echo "publish failed"; else echo "fetch failed (round $i)"; fi
            [ "$i" -lt 17 ] && sleep 1200
          done
