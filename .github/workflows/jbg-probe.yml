name: jbg-probe
on:
  push:
    branches: [claude/project-thread-2v4ene]
    paths: ['.github/workflows/jbg-probe.yml', 'scripts/jbg-probe.sh']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: bash scripts/jbg-probe.sh
