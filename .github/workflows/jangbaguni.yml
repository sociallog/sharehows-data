name: jangbaguni-weekly
# Every Monday morning (KST) compute last week's wholesale price changes for the
# 장바구니 지도 and publish out/jangbaguni.json to the `jangbaguni` branch.
# Several cron slots because GitHub's scheduler is unreliable on this repo; a run
# exits early when that week is already published.
on:
  schedule:
    - cron: '10 21 * * 0'   # Mon 06:10 KST
    - cron: '40 22 * * 0'   # Mon 07:40 KST
    - cron: '10 0 * * 1'    # Mon 09:10 KST
  workflow_dispatch:
    inputs:
      force:
        description: 'Recompute even if this week is already published'
        type: boolean
        default: false
  push:
    branches: [claude/project-thread-2v4ene]
    paths: ['scripts/jangbaguni.mjs', '.github/workflows/jangbaguni.yml']
permissions:
  contents: write
concurrency:
  group: jangbaguni
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compute and publish
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name != 'schedule' && 'true' || inputs.force }}
        run: |
          node scripts/jangbaguni.mjs
          NEW=$(node -e "console.log(require('./out/jangbaguni.json').week.this[1])")
          OLD=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/jangbaguni/jangbaguni.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).week.this[1])}catch{console.log('')}})" || true)
          echo "new week ends $NEW, published week ends ${OLD:-none}"
          if [ "$NEW" = "$OLD" ] && [ "$FORCE" != "true" ]; then echo "already published"; exit 0; fi
          rm -rf pub && mkdir pub && cp out/jangbaguni.json pub/ && cd pub
          git init -q -b jangbaguni
          git config user.name "sharehows-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jangbaguni.json
          git commit -qm "jangbaguni week ending $NEW"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" jangbaguni
