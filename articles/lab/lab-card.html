<style>
#shlab{position:fixed;inset:0;z-index:2147482000;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#141416;color:#f3f3f1;font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#shlab *{box-sizing:border-box;margin:0;padding:0;color:inherit;font-family:inherit;letter-spacing:normal}
#shlab .sl{position:relative;min-height:100dvh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:84px 22px 64px;overflow:hidden}
#shlab .in{width:100%;max-width:980px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
#shlab .tx{position:relative;z-index:2}
#shlab .ex{font:700 13px/1 Pretendard;letter-spacing:.18em;color:#0db8ee;margin-bottom:18px}
#shlab h1{font-size:clamp(40px,8vw,84px);line-height:1.04;font-weight:800;letter-spacing:-.035em}
#shlab h2{font-size:clamp(30px,5.6vw,54px);line-height:1.14;font-weight:800;letter-spacing:-.03em}
#shlab .q{font-size:clamp(17px,2.2vw,20px);line-height:1.65;color:#b9b9b4;margin-top:18px;max-width:30em}
#shlab .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
#shlab .meta span{font-size:12.5px;font-weight:600;border:1px solid #3a3a3e;border-radius:99px;padding:5px 11px;color:#cfcfca}
#shlab .go{display:inline-flex;align-items:center;gap:10px;margin-top:28px;background:#f3f3f1;color:#141416!important;font-weight:800;font-size:16px;padding:14px 22px;border-radius:14px;text-decoration:none;transition:transform .2s}
#shlab .go:hover{transform:translateX(4px)}
#shlab .vis{position:relative;aspect-ratio:1;width:100%;max-width:420px;justify-self:center}
#shlab .rail{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:5}
#shlab .rail a{width:9px;height:9px;border-radius:50%;background:#55555a;transition:all .25s;display:block}
#shlab .rail a.on{background:#0db8ee;transform:scale(1.4)}
#shlab .cue{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:13px;color:#8d8d88;animation:shb 1.8s infinite}
@keyframes shb{50%{transform:translate(-50%,6px)}}
#shlab .rev{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
#shlab .sl.on .rev{opacity:1;transform:none}
#shlab .sl.on .rev.d1{transition-delay:.12s}#shlab .sl.on .rev.d2{transition-delay:.24s}#shlab .sl.on .rev.d3{transition-delay:.36s}

#shlab .intro .in{grid-template-columns:1fr}
#shlab .beaker{position:absolute;inset:0;pointer-events:none;opacity:.55}
#shlab .pr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px;max-width:760px}
#shlab .pr div{border-top:2px solid #0db8ee;padding-top:12px;font-size:15px;line-height:1.55;color:#cfcfca}
#shlab .pr b{display:block;font-size:17px;color:#f3f3f1;margin-bottom:4px}
/* exp colors */
#shlab .e1{background:radial-gradient(120% 80% at 80% 50%,#2a1714 0,#141416 60%)}
#shlab .e2{background:radial-gradient(120% 80% at 80% 50%,#13261a 0,#141416 60%)}
#shlab .e3{background:radial-gradient(120% 80% at 80% 50%,#2b1a12 0,#141416 60%)}
/* v1: racing lines */
#shlab .v1 svg{width:100%;height:100%}
#shlab .v1 path{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900}
#shlab .sl.on .v1 path{animation:shdraw 2.6s cubic-bezier(.3,.6,.2,1) forwards}
#shlab .sl.on .v1 path.c2{animation-delay:.25s}#shlab .sl.on .v1 path.c3{animation-delay:1.4s;animation-duration:1.6s}
@keyframes shdraw{to{stroke-dashoffset:0}}
#shlab .v1 text{font:700 15px Pretendard;fill:#cfcfca}
/* v2: market tiles */
#shlab .v2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:center}
#shlab .v2 i{aspect-ratio:1;border-radius:14px;background:#1f2f24;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(18px,3.4vw,28px);font-weight:800;opacity:0;transform:scale(.7);transition:opacity .5s,transform .5s}
#shlab .v2 i.u{color:#ff6b5a}#shlab .v2 i.d{color:#4fc3f7}#shlab .v2 i.s{color:#7d8f80}
#shlab .sl.on .v2 i{opacity:1;transform:none}
/* v3: 100 dots */
#shlab .v3{display:grid;grid-template-columns:repeat(10,1fr);gap:7%;padding:6%;align-content:center}
#shlab .v3 i{aspect-ratio:1;border-radius:50%;background:#3a3531;transition:background .5s,transform .5s}
#shlab .v3 i.o{background:#e8573c;transform:scale(1.08)}
/* outro */
#shlab .outro .in{grid-template-columns:1fr;text-align:center;justify-items:center}
#shlab .next{width:120px;height:120px;border-radius:50%;border:2px dashed #3a3a3e;display:flex;align-items:center;justify-content:center;font-size:40px;color:#55555a;margin-bottom:28px;animation:shpulse 2.4s ease-in-out infinite}
@keyframes shpulse{50%{transform:scale(1.08);border-color:#0db8ee;color:#0db8ee}}
#shlab .alt{background:none;border:1.5px solid #f3f3f1;color:#f3f3f1!important}
@media (max-width:760px){
 #shlab .in{grid-template-columns:1fr;gap:26px}
 #shlab .vis{max-width:300px;order:-1}
 #shlab .sl{padding:76px 20px 56px;align-items:flex-start}
 #shlab .pr{grid-template-columns:1fr}
 #shlab .rail{right:8px}
}
</style>
